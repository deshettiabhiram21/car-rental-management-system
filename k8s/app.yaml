apiVersion: apps/v1
kind: Deployment
metadata:
  name: car-rental-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: car-rental-app
  template:
    metadata:
      labels:
        app: car-rental-app
    spec:
      containers:
        - name: app
          image: car-rental-management-system-app:latest
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 5000

          env:
            - name: MYSQL_USER
              value: caruser

            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD

            - name: MYSQL_HOST
              value: car-rental-mysql

            - name: MYSQL_PORT
              value: "3306"

            - name: MYSQL_DATABASE
              value: car_rental

            - name: FLASK_SECRET_KEY
              value: "car-rental-kubernetes-secret"

---
apiVersion: v1
kind: Service
metadata:
  name: car-rental-app-service
spec:
  type: NodePort
  selector:
    app: car-rental-app
  ports:
    - port: 5000
      targetPort: 5000
